on:
  workflow_dispatch:
  push:
    branches: main

name: Quarto Publish

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Quarto
        uses: quarto-dev/quarto-actions/setup@v2

      - name: Render both slide decks
        run: |
          quarto render voxconf-2026-slides
          quarto render tkf-2026-slides

      - name: Build GitHub Pages site
        run: |
          mkdir -p site/voxconf-2026-slides site/tkf-2026-slides
          cp -R voxconf-2026-slides/output_html/. site/voxconf-2026-slides/
          cp -R tkf-2026-slides/output_html/. site/tkf-2026-slides/
          cp .github/pages/index.html site/index.html
          touch site/.nojekyll

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
