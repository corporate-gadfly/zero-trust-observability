on:
  workflow_dispatch:
  push:
    branches: main
    paths:
      - "voxconf-2026-slides/**"
      - "tkf-2026-slides/**"

name: Quarto Publish

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Quarto
        uses: quarto-dev/quarto-actions/setup@8a96df13519ee81fd526f2dfca5962811136661b # v2.2.0

      - name: Render both slide decks
        run: |
          quarto render voxconf-2026-slides
          quarto render tkf-2026-slides

      - name: Build GitHub Pages site
        run: |
          mkdir -p site/voxconf-2026-slides site/tkf-2026-slides
          cp -R voxconf-2026-slides/output_html/. site/voxconf-2026-slides/
          cp -R tkf-2026-slides/output_html/. site/tkf-2026-slides/
          cp .github/pages/index.html site/index.html
          touch site/.nojekyll

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
